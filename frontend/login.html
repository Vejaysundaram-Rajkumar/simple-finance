<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Finance | Sign in</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="login-page">
  <div class="app-loader" id="loginLoader" role="status" aria-live="polite"><span class="loader-ring"></span><span>Connecting to Google...</span></div>
  <main class="login-container">
    <div class="brand-icon">₹</div>
    <p class="eyebrow">PERSONAL FINANCE</p>
    <h1>Simple Finance</h1>
    <p class="login-description">A calmer way to understand where your money goes.</p>
    <button class="google-button" id="loginButton"><span class="google-g">G</span> Continue with Google</button>
    <p class="login-note">Your data is stored in your private Firebase account.</p>
  </main>
  <script type="module">
    import { login } from "./js/auth.js";
    document.getElementById("loginButton").addEventListener("click", async (event) => {
      const button = event.currentTarget;
      button.disabled = true;
      const loader = document.getElementById("loginLoader");
      const loadingTimer = setTimeout(() => loader.classList.add("visible"), 5000);
      try { await login(); } catch (error) { clearTimeout(loadingTimer); loader.classList.remove("visible"); alert(error.message); button.disabled = false; }
    });
  </script>
</body>
</html>
