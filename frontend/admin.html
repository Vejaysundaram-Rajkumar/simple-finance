<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Finance | Admin</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="app-loader" id="adminLoader" role="status" aria-live="polite"><span class="loader-ring"></span><span>Loading usage data...</span></div>
  <main class="admin-shell">
    <header class="admin-header"><div><p class="eyebrow">PRIVATE OPERATIONS</p><h1>Usage dashboard</h1><p class="admin-subtitle">Aggregate product activity only.</p></div><button class="secondary-button" id="logoutButton">Sign out</button></header>
    <p class="admin-status" id="adminStatus">Loading usage data...</p>
    <section class="admin-metrics" id="metrics"></section>
    <section class="chart-card admin-chart"><h2>Logins by day</h2><div class="admin-bars" id="loginChart"></div></section>
  </main>
  <script type="module" src="./js/admin.js"></script>
</body>
</html>
